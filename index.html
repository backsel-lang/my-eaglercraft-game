<!DOCTYPE html>
<html>
<head>
 <title>My Eaglercraft Game</title>

 <style>
 body {
 margin: 0;
 background: #111;
 color: white;
 font-family: Arial, sans-serif;
 text-align: center;
 }

 .screen {
 width: 100%;
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 .box {
 background: #222;
 padding: 40px;
 border-radius: 15px;
 width: 350px;
 }

 h1 {
 font-size: 36px;
 }

 input {
 width: 90%;
 padding: 12px;
 margin: 8px;
 border-radius: 6px;
 border: none;
 }

 button {
 padding: 12px 25px;
 margin: 8px;
 border: none;
 border-radius: 6px;
 cursor: pointer;
 font-size: 16px;
 }

 #playButton {
 display: none;
 }

 #message {
 margin-top: 15px;
 }
 </style>
</head>

<body>

<div class="screen">
 <div class="box">

 <h1>MY GAME</h1>

 <h2>Log In</h2>

 <input id="username" type="text" placeholder="Username">

 <input id="password" type="password" placeholder="Password">

 <br>

 <button onclick="login()">Log In</button>

 <br>

 <button id="playButton" onclick="playGame()">PLAY</button>

 <p id="message"></p>

 </div>
</div>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/a/macros/hendricks.k12.in.us/s/AKfycbyju-zC47qXL7hmgPYTmdBrSx6V5JnB6KAVAzUf5DjBhZ7-053x__EQeTDIXvurSSHu/exec";

function login() {

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;

const message =
document.getElementById("message");

const playButton =
document.getElementById("playButton");

if (!username || !password) {
message.innerText = "Enter your username and password.";
return;
}

message.innerText = "Logging in...";
playButton.style.display = "none";

const frameName = "loginFrame_" + Date.now();

const iframe = document.createElement("iframe");
iframe.name = frameName;
iframe.style.display = "none";

document.body.appendChild(iframe);

const form = document.createElement("form");

form.method = "POST";
form.action = APPS_SCRIPT_URL;
form.target = frameName;
form.style.display = "none";

const input = document.createElement("input");

input.type = "hidden";
input.name = "data";

input.value = JSON.stringify({
action: "login",
username: username,
password: password
});

form.appendChild(input);
document.body.appendChild(form);

let finished = false;

function handleMessage(event) {

if (finished) return;

if (!event.data ||
typeof event.data.success !== "boolean") {
return;
}

finished = true;

message.innerText = event.data.message;

if (event.data.success) {
playButton.style.display = "inline-block";
}

window.removeEventListener("message", handleMessage);

form.remove();
iframe.remove();
}

window.addEventListener("message", handleMessage);

form.submit();

setTimeout(function() {

if (!finished) {

finished = true;

message.innerText =
"The account server did not respond.";

window.removeEventListener(
"message",
handleMessage
);

form.remove();
iframe.remove();
}

}, 10000);
}


function playGame() {

// We will connect Eaglercraft here later.

}

</script>

</body>
</html>
