<!DOCTYPE html>
<html>
<head>
 <title>My Eaglercraft Game</title>

 <style>
 body {
 margin: 0;
 background: #111;
 color: white;
 font-family: Arial, sans-serif;
 text-align: center;
 }

 .screen {
 width: 100%;
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 .box {
 background: #222;
 padding: 40px;
 border-radius: 15px;
 width: 350px;
 }

 h1 {
 font-size: 36px;
 }

 input {
 width: 90%;
 padding: 12px;
 margin: 8px;
 border-radius: 6px;
 border: none;
 box-sizing: border-box;
 }

 button {
 padding: 12px 25px;
 margin: 8px;
 border: none;
 border-radius: 6px;
 cursor: pointer;
 font-size: 16px;
 }

 #playButton {
 display: none;
 }

 #message {
 margin-top: 15px;
 }
 </style>
</head>

<body>

 <div class="screen">
 <div class="box">

 <h1>MY GAME</h1>

 <h2>Log In</h2>

 <input id="username" type="text" placeholder="Username">

 <input id="password" type="password" placeholder="Password">

 <br>

 <button onclick="login()">Log In</button>

 <br>

 <button id="playButton" onclick="playGame()">PLAY</button>

 <p id="message"></p>

 </div>
 </div>

 <script>

 const APPS_SCRIPT_URL =
 "https://script.google.com/a/macros/hendricks.k12.in.us/s/AKfycbyju-zC47qXL7hmgPYTmdBrSx6V5JnB6KAVAzUf5DjBhZ7-053x__EQeTDIXvurSSHu/exec";

 function login() {

 const message =
 document.getElementById("message");

 const playButton =
 document.getElementById("playButton");

 message.innerText =
 "Opening account login...";

 playButton.style.display = "none";

 window.location.href = APPS_SCRIPT_URL;
 }

 function playGame() {

 alert("Login worked! We will connect Eaglercraft next.");

 }

 </script>

</body>
</html>
