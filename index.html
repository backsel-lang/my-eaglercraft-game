<!DOCTYPE html>
<html>
<head>
 <title>My Eaglercraft Game</title>

 <style>
 body {
 margin: 0;
 background: #111;
 color: white;
 font-family: Arial, sans-serif;
 text-align: center;
 }

 .screen {
 width: 100%;
 height: 100vh;
 display: flex;
 justify-content: center;
 align-items: center;
 }

 .box {
 background: #222;
 padding: 40px;
 border-radius: 15px;
 width: 350px;
 }

 h1 {
 font-size: 36px;
 }

 input {
 width: 90%;
 padding: 12px;
 margin: 8px;
 border-radius: 6px;
 border: none;
 }

 button {
 padding: 12px 25px;
 margin: 8px;
 border: none;
 border-radius: 6px;
 cursor: pointer;
 font-size: 16px;
 }

 #playButton {
 display: none;
 }

 #message {
 margin-top: 15px;
 }
 </style>
</head>

<body>

<div class="screen">
 <div class="box">

 <h1>MY GAME</h1>

 <h2>Log In</h2>

 <input id="username" type="text" placeholder="Username">

 <input id="password" type="password" placeholder="Password">

 <br>

 <button onclick="login()">Log In</button>

 <br>

 <button id="playButton" onclick="playGame()">PLAY</button>

 <p id="message"></p>

 </div>
</div>

<script>

async function login() {

let username = document.getElementById("username").value;
let password = document.getElementById("password").value;

const message = document.getElementById("message");
const playButton = document.getElementById("playButton");

if (!username || !password) {
message.innerText = "Enter your username and password.";
return;
}

message.innerText = "Logging in...";
playButton.style.display = "none";

const iframe = document.createElement("iframe");

iframe.name = "loginFrame";
iframe.style.display = "none";

document.body.appendChild(iframe);

const form = document.createElement("form");

form.method = "POST";
form.action = "https://script.google.com/a/macros/hendricks.k12.in.us/s/AKfycbyju-zC47qXL7hmgPYTmdBrSx6V5JnB6KAVAzUf5DjBhZ7-053x__EQeTDIXvurSSHu/exec";
form.target = "loginFrame";

const data = {
action: "login",
username: username,
password: password
};

const input = document.createElement("input");

input.type = "hidden";
input.name = "data";
input.value = JSON.stringify(data);

form.appendChild(input);
document.body.appendChild(form);

window.addEventListener("message", function handleLogin(event) {

const result = event.data;

if (!result || typeof result.success !== "boolean") {
return;
}

message.innerText = result.message;

if (result.success) {
playButton.style.display = "inline-block";
}

window.removeEventListener("message", handleLogin);
form.remove();
iframe.remove();

});

form.submit();
}

function playGame() {

 // We'll connect Eaglercraft here later.

}

</script>

</body>
</html>
